<<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Graficador con coordenadas</title>
</head>
<body>

<h3>Graficador de funciones</h3>

<input type="text" id="func" placeholder="Escribe y presiona Enter (Ej: x*x o Math.sin(x))">

<br><br>

<canvas id="canvas" width="600" height="400" style="border:1px solid black;"></canvas>

<script>

let escala = 40;
let funcion = null;

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

// ENTER
document.getElementById("func").addEventListener("keydown", function(e){
  if (e.key === "Enter") {
    try {
      funcion = new Function("x", "return " + this.value);
      dibujar();
    } catch {
      alert("Función inválida");
    }
  }
});

// ZOOM
canvas.addEventListener("wheel", function(e){
  e.preventDefault();

  if (e.deltaY < 0) escala += 5;
  else {
    escala -= 5;
    if (escala < 10) escala = 10;
  }

  dibujar();
});

function dibujar() {

  ctx.clearRect(0, 0, canvas.width, canvas.height);

  let cx = canvas.width / 2;
  let cy = canvas.height / 2;

  // 🔹 Ejes
  ctx.beginPath();
  ctx.moveTo(0, cy);
  ctx.lineTo(canvas.width, cy);
  ctx.moveTo(cx, 0);
  ctx.lineTo(cx, canvas.height);
  ctx.stroke();

  //Coordenadas en X
  ctx.font = "10px Arial";
  for (let x = -10; x <= 10; x++) {
    let px = cx + x * escala;

    ctx.fillText(x, px - 5, cy + 15); // número
    ctx.beginPath();
    ctx.moveTo(px, cy - 3);
    ctx.lineTo(px, cy + 3);
    ctx.stroke();
  }

  //Coordenadas en Y
  for (let y = -5; y <= 5; y++) {
    let py = cy - y * escala;

    ctx.fillText(y, cx + 5, py + 3); // número
    ctx.beginPath();
    ctx.moveTo(cx - 3, py);
    ctx.lineTo(cx + 3, py);
    ctx.stroke();
  }

  //Función
  if (!funcion) return;

  ctx.beginPath();

  for (let px = 0; px < canvas.width; px++) {

    let x = (px - cx) / escala;
    let y = funcion(x);
    let py = cy - y * escala;

    if (px === 0) ctx.moveTo(px, py);
    else ctx.lineTo(px, py);
  }

  ctx.stroke();
}

// inicial
dibujar();

</script>

</body>
</html>
